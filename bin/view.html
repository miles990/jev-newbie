<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jev view</title>
<style>
:root{--bg:#f5f5f1;--surface:#fcfcfb;--surface-2:#efeeea;--ink:#0b0b0b;--ink-2:#52514e;--ink-3:#8a8984;--line:#dedcd6;--s1:#2a78d6;--s2:#eb6834;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--band:rgba(11,11,11,.06);--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"IBM Plex Sans","Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--surface:#1a1a19;--surface-2:#232321;--ink:#fff;--ink-2:#c3c2b7;--ink-3:#8f8e86;--line:#2e2e2b;--s1:#3987e5;--s2:#d95926;--band:rgba(255,255,255,.07)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:24px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--ink-2);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}.stat .k{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}.chip{font:13px var(--sans);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:13px var(--sans);padding:5px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:220px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(220px,1.2fr) 2fr auto;gap:12px;align-items:start}
.row .meta{font:11px var(--mono);color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}.row .state{font:12px var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:96px;overflow:auto}
.dec{font:12px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.dec.yes,.dec.keep{border-color:var(--good);color:var(--good)}.dec.no,.dec.drop{border-color:var(--crit);color:var(--crit)}.dec.unsure{border-color:var(--warn);color:var(--ink-2)}
.q{display:grid;grid-template-columns:110px 1fr 44px;gap:6px 8px;align-items:center;font:12px var(--mono);margin-bottom:6px}.q .n{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q .v{text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}.track .band{position:absolute;left:35%;width:30%;top:0;bottom:0;background:var(--band)}.track .fill{position:absolute;left:0;top:1px;bottom:1px;background:var(--s1);border-radius:0 3px 3px 0}
.opts{display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--mono);color:var(--ink-3)}.opts b{color:var(--ink);font-weight:500}
.hist{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}.hist h3{margin:0 0 8px;font-size:13px;color:var(--ink-2)}.hbars{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;align-items:end;height:80px}.hbars div{background:var(--s1);border-radius:2px 2px 0 0;min-height:2px;position:relative}.hbars div b{position:absolute;top:-16px;left:0;right:0;text-align:center;font:10px var(--mono);color:var(--ink-2)}.hx{display:grid;grid-template-columns:repeat(10,1fr);font:10px var(--mono);color:var(--ink-3);text-align:center;border-top:1px solid var(--line);padding-top:3px;margin-top:2px}
.qi{font:11px var(--mono);color:var(--ink-3);white-space:pre-wrap;margin:0 0 8px}
@media (max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h1>jev view</h1><button class="chip" id="lang" type="button" aria-label="language">English</button></div><p class="sub" data-i18n="sub">每一筆是一次真實呼叫：送了什麼、問了什麼、回了什麼機率、程式碼決定了什麼。灰帶是 0.35 到 0.65 的不確定區。</p>
<div class="stats" id="stats"></div>
<div class="hist" id="hist"></div>
<div class="filters" id="filters"><input type="search" id="q" placeholder="搜尋 state / 決定 / 問題…" aria-label="search"></div>
<div id="rows"></div>
</div>
<script id="data" type="application/json">__RECORDS__</script>
<script>
const I18N={zh:{sub:'每一筆是一次真實呼叫：送了什麼、問了什麼、回了什麼機率、程式碼決定了什麼。灰帶是 0.35 到 0.65 的不確定區。',records:'紀錄',latency:'延遲中位數',tokens:'tokens',cost:'費用估計',model:'模型',all:'全部',hist:'機率／信心分布（所有答案，{n} 個）：集中在兩端表示問題清楚，堆在中間表示問題或資料不夠明確',search:'搜尋 state / 決定 / 問題…',empty:'沒有符合的紀錄。',toggle:'English'},en:{sub:'One row per real call: what went in, what was asked, what probabilities came back, what the code decided. The shaded band is the 0.35–0.65 uncertain zone.',records:'records',latency:'median latency',tokens:'tokens',cost:'est. cost',model:'model',all:'all',hist:'Probability / confidence distribution ({n} answers): piled at the ends means clear questions; a hump in the middle means the question or data is ambiguous',search:'search state / decision / question…',empty:'No matching records.',toggle:'中文'}};
let LANG=(()=>{try{return localStorage.getItem('jev-lang')}catch{return null}})()||((navigator.language||'').startsWith('zh')?'zh':'en');const T=k=>I18N[LANG][k];
const R=JSON.parse(document.getElementById('data').textContent);const $=s=>document.querySelector(s);const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const labels=[...new Set(R.map(r=>r.label||r.cmd))];let cur='all',query='';
const S=$('#stats');const st=(k,v)=>{const d=el('div','stat');d.append(el('div','k',k),el('div','v',v));S.append(d);};
const ms=R.map(r=>r.latencyMs).filter(Number.isFinite).sort((a,b)=>a-b);const tok=R.reduce((s,r)=>s+(r.inputTokens||0),0);
function stats(){S.replaceChildren();st(T('records'),String(R.length));st(T('latency'),ms.length?ms[Math.floor(ms.length/2)]+' ms':'-');st(T('tokens'),tok.toLocaleString());st(T('cost'),'US$'+(tok/1e6*0.042).toFixed(4));st(T('model'),[...new Set(R.map(r=>r.model))].join(', '));}
const F=$('#filters');function chips(){F.querySelectorAll('.chip').forEach(c=>c.remove());[['all',T('all')],...labels.map(l=>[l,l])].forEach(([v,t])=>{const b=el('button','chip',t+' '+(v==='all'?R.length:R.filter(r=>(r.label||r.cmd)===v).length));b.setAttribute('aria-pressed',v==='all');b.onclick=()=>{cur=v;F.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render();};F.insertBefore(b,$('#q'));});}
$('#q').oninput=e=>{query=e.target.value.toLowerCase();render();};
function visible(){return R.filter(r=>(cur==='all'||(r.label||r.cmd)===cur)&&(!query||JSON.stringify(r).toLowerCase().includes(query)));}
function hist(rows){const H=$('#hist');H.replaceChildren();const vals=[];for(const r of rows)for(const a of Object.values(r.answers))vals.push(a.type==='noul'?a.p:a.confidence);if(!vals.length)return;const bins=Array(10).fill(0);vals.forEach(v=>bins[Math.min(9,Math.floor(v*10))]++);const mx=Math.max(...bins);H.append(el('h3',null,T('hist').replace('{n}',vals.length)));const hb=el('div','hbars');bins.forEach(n=>{const d=el('div');d.style.height=(n/mx*100)+'%';if(n)d.append(el('b',null,String(n)));hb.append(d);});H.append(hb);const hx=el('div','hx');for(let i=0;i<10;i++)hx.append(el('div',null,(i/10).toFixed(1)));H.append(hx);}
function render(){const rows=visible();hist(rows);const C=$('#rows');C.replaceChildren();
 for(const r of rows.slice().reverse()){const d=el('div','row');const left=el('div');const m=el('div','meta');m.append(el('span',null,r.at.replace('T',' ').slice(0,19)),el('span',null,r.cmd+(r.label?' · '+r.label:'')+(r.id?' #'+r.id:'')),el('span',null,(r.latencyMs??'-')+' ms'),el('span',null,r.stateHash));left.append(m,el('div','state',r.statePreview));d.append(left);
  const mid=el('div');for(const [k,a] of Object.entries(r.answers)){const q=el('div','q');q.append(el('div','n',k));const t=el('div','track');t.append(el('div','band'));const f=el('div','fill');const v=a.type==='noul'?a.p:a.confidence;f.style.width=(v*100)+'%';t.append(f);q.append(t);q.append(el('div','v',v.toFixed(2)));mid.append(q);
   if(a.type!=='noul'){const o=el('div','opts');for(const [name,p] of Object.entries(a.probabilities).sort((x,y)=>y[1]-x[1])){const s=el('span');if(String(name)===String(a.value)){const b=el('b',null,name);s.append(b);}else s.append(document.createTextNode(name));s.append(document.createTextNode(' '+(p*100).toFixed(0)+'%'));o.append(s);}mid.append(o);}
   const qi=el('div','qi',(r.questions[k]?.type||'')+' · '+(r.questions[k]?.instructions||''));mid.append(qi);}
  d.append(mid);const right=el('div');if(r.decision!=null){const dec=el('span','dec '+String(r.decision).toLowerCase().replace(/[^a-z]/g,''),String(r.decision));right.append(dec);}d.append(right);C.append(d);}
 if(!rows.length)C.append(el('p','sub',T('empty')));}
function applyLang(){document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';$('[data-i18n=sub]').textContent=T('sub');$('#q').placeholder=T('search');$('#lang').textContent=T('toggle');stats();chips();render();}
$('#lang').onclick=()=>{LANG=LANG==='zh'?'en':'zh';try{localStorage.setItem('jev-lang',LANG)}catch{}applyLang();};
applyLang();
</script>
</body></html>
